name: Build Debug APK + Decode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" admob-demo.apk

      - name: Install apktool (latest)
        run: |
          URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep browser_download_url | grep '\.jar"' | head -1 | cut -d'"' -f4)
          echo "apktool: $URL"
          curl -L -o apktool.jar "$URL"

      - name: Decode with apktool
        run: |
          java -jar apktool.jar d -f admob-demo.apk -o admob-demo_src
          zip -qr admob-demo_src.zip admob-demo_src

      - name: Check ads SDK is readable (not obfuscated)
        run: |
          find admob-demo_src -path "*com/google/android/gms/ads/AdView.smali" || echo "AdView NOT FOUND"
          echo "internal/ads classes:"
          find admob-demo_src -path "*gms/internal/ads/*" -name "*.smali" | wc -l

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: admob-demo-decoded
          path: |
            admob-demo_src.zip
            admob-demo.apk
