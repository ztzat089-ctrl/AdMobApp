name: Build Debug APK + Decode

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create mini project
        run: |
          mkdir -p mini/app/src/main/java/com/example/adsdk
          cat > mini/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > mini/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "adsdk"
          include ':app'
          EOF
          cat > mini/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > mini/app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.example.adsdk'
            compileSdk 35
            defaultConfig {
              applicationId 'com.example.adsdk'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
              multiDexEnabled true
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            buildTypes {
              debug {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'com.google.android.gms:play-services-ads:23.6.0'
          }
          EOF
          cat > mini/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="adsdk">
              <meta-data
                android:name="com.google.android.gms.ads.APPLICATION_ID"
                android:value="ca-app-pub-3940256099942544~3347511713"/>
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > mini/app/src/main/java/com/example/adsdk/MainActivity.java <<'EOF'
          package com.example.adsdk;

          import android.app.Activity;
          import android.os.Bundle;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              MobileAds.initialize(this);
              AdView v = new AdView(this);
              v.setAdSize(AdSize.BANNER);
              v.setAdUnitId("ca-app-pub-3940256099942544/6300978111");
              v.loadAd(new AdRequest.Builder().build());
              setContentView(v);
            }
          }
          EOF

      - name: Build debug APK
        run: |
          gradle -p mini assembleDebug --no-daemon > build.log 2>&1 || { grep -B2 -A20 "What went wrong" build.log; exit 1; }
          tail -5 build.log

      - name: Locate APK
        run: |
          APK=$(find mini/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" admob-demo.apk

      - name: Install apktool (latest)
        run: |
          URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep browser_download_url | grep '\.jar"' | head -1 | cut -d'"' -f4)
          echo "apktool: $URL"
          curl -L -o apktool.jar "$URL"

      - name: Decode with apktool
        run: |
          java -jar apktool.jar d -f admob-demo.apk -o admob-demo_src
          zip -qr admob-demo_src.zip admob-demo_src

      - name: Check ads SDK is readable
        run: |
          find admob-demo_src -path "*com/google/android/gms/ads/AdView.smali" || echo "AdView NOT FOUND"
          echo "internal/ads classes:"
          find admob-demo_src -path "*gms/internal/ads/*" -name "*.smali" | wc -l

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: admob-demo-decoded
          path: |
            admob-demo_src.zip
            admob-demo.apk
